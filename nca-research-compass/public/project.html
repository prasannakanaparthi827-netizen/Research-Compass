<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Project — NCA Research Compass</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="nav" id="nav"></div>

<div class="container" id="projectHeader" style="display:none; padding-top:28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
  <h2 id="projectTitle" style="margin:0; font-size:20px;"></h2>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-outline" id="exportBtn">⬇ Export Proposal</button>
    <button class="btn btn-ghost" id="deleteProjectBtn" style="color:var(--rose);">Delete project</button>
  </div>
</div>

<div class="wizard" id="wizard" style="display:none;">
  <div class="stage-nav" id="stageNav"></div>
  <div class="stage-content" id="stageContent"></div>
</div>

<div id="loadingState" class="container" style="padding:64px 24px; text-align:center; color:var(--ink-soft);">Loading your project…</div>

<script src="/js/app.js"></script>
<script>
if (Auth.requireLogin()) renderNav();

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");
let project = null;
let stages = null;
let activeStageNumber = 1;
let isEditing = false;
let isExpanded = false;

function renderMarkdown(md) {
  let html = escapeHtml(md || "");
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^---$/gm, "<hr>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  html = html.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g, (m, pre, block) => {
    const items = block.trim().split("\n").map((l) => "<li>" + l.replace(/^[-*] /, "") + "</li>").join("");
    return pre + "<ul>" + items + "</ul>";
  });
  html = html.replace(/(^|\n)((?:\d+\.\s.*(?:\n|$))+)/g, (m, pre, block) => {
    const items = block.trim().split("\n").map((l) => "<li>" + l.replace(/^\d+\.\s/, "") + "</li>").join("");
    return pre + "<ol>" + items + "</ol>";
  });
  html = html.split(/\n{2,}/).map((block) => {
    const t = block.trim();
    if (!t) return "";
    if (/^<h[1-3]>|^<ul>|^<ol>|^<hr>/.test(t)) return t;
    return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return html;
}

async function load() {
  if (!projectId) {
    window.location.href = "/dashboard.html";
    return;
  }
  try {
    const data = await api("/project?id=" + projectId);
    project = data.project;
    stages = data.stages;
    activeStageNumber = Math.min(project.current_stage, STAGES.length);
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("wizard").style.display = "grid";
    document.getElementById("projectHeader").style.display = "flex";
    document.getElementById("projectTitle").textContent = project.title;
    renderStageNav();
    renderStageContent();
  } catch (err) {
    document.getElementById("loadingState").textContent = err.message;
  }
}

function renderStageNav() {
  const nav = document.getElementById("stageNav");
  nav.innerHTML = STAGES.map((s) => {
    const stageData = stages.find((st) => st.number === s.number);
    const done = stageData && stageData.content;
    const locked = s.number > project.current_stage && !done;
    let cls = "stage-nav-item";
    if (s.number === activeStageNumber) cls += " active";
    if (done) cls += " done";
    if (locked) cls += " locked";
    return `<div class="${cls}" data-n="${s.number}">
      <span class="n">${done ? "✓" : s.number}</span>
      <span>${s.title}</span>
    </div>`;
  }).join("");

  nav.querySelectorAll(".stage-nav-item").forEach((el) => {
    el.addEventListener("click", () => {
      const n = parseInt(el.dataset.n, 10);
      const stageData = stages.find((st) => st.number === n);
      const done = stageData && stageData.content;
      if (n > project.current_stage && !done) return;
      activeStageNumber = n;
      isEditing = false;
      isExpanded = false;
      renderStageNav();
      renderStageContent();
    });
  });
}

function renderStageContent() {
  const content = document.getElementById("stageContent");
  const stage = STAGES.find((s) => s.number === activeStageNumber);
  const stageData = stages.find((st) => st.number === activeStageNumber);
  const hasContent = stageData && stageData.content;

  let body = "";
  if (activeStageNumber === 1) {
    body = `
      <div class="generated-note">
        <textarea readonly>${escapeHtml(project.problem_statement)}</textarea>
      </div>
      <p class="save-hint">This is the problem statement your project is built on.</p>
    `;
  } else if (hasContent) {
    const expandedClass = isExpanded ? " expanded" : "";
    body = `
      ${isExpanded ? '<div class="expand-overlay" id="expandOverlay"></div>' : ""}
      <div class="generated-note${expandedClass}" id="noteBox">
        <div class="note-toolbar">
          <button class="icon-btn" id="expandBtn">${isExpanded ? "⤡ Collapse" : "⤢ Expand"}</button>
          <button class="icon-btn" id="editBtn">${isEditing ? "✓ Done editing" : "✎ Edit"}</button>
        </div>
        ${isEditing
          ? `<textarea id="stageText">${escapeHtml(stageData.content)}</textarea>`
          : `<div class="md-view">${renderMarkdown(stageData.content)}</div>`
        }
      </div>
      <div class="stage-actions">
        ${isEditing ? `<button class="btn btn-primary" id="saveBtn">Save changes</button>` : ""}
        <button class="btn btn-outline" id="regenBtn">Regenerate</button>
        ${activeStageNumber < STAGES.length ? `<button class="btn btn-ghost" id="nextBtn">Next stage →</button>` : ""}
        <span class="save-hint" id="saveHint"></span>
      </div>
    `;
  } else {
    body = `
      <div class="card" style="text-align:center; padding:48px 24px;">
        <p style="color:var(--ink-soft); margin-bottom:20px;">Generate a draft for this stage based on your problem statement. You'll be able to edit every word.</p>
        <button class="btn btn-gold" id="generateBtn">Generate this section</button>
      </div>
    `;
  }

  content.innerHTML = `
    <span class="stage-count mono">STAGE ${stage.number} OF ${STAGES.length}</span>
    <h2>${stage.title}</h2>
    <div class="ps-banner"><strong>Problem statement:</strong> ${escapeHtml(project.problem_statement)}</div>
    ${body}
  `;

  const generateBtn = document.getElementById("generateBtn");
  if (generateBtn) generateBtn.addEventListener("click", () => generate(activeStageNumber, generateBtn));

  const regenBtn = document.getElementById("regenBtn");
  if (regenBtn) regenBtn.addEventListener("click", () => {
    if (hasContent && !confirm("Regenerate this section? Your current text (including any edits) will be replaced.")) return;
    generate(activeStageNumber, regenBtn);
  });

  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.addEventListener("click", saveCurrentStage);

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    activeStageNumber += 1;
    isEditing = false;
    isExpanded = false;
    renderStageNav();
    renderStageContent();
  });

  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.addEventListener("click", () => {
    isEditing = !isEditing;
    renderStageContent();
  });

  const expandBtn = document.getElementById("expandBtn");
  if (expandBtn) expandBtn.addEventListener("click", () => {
    isExpanded = !isExpanded;
    renderStageContent();
  });

  const overlay = document.getElementById("expandOverlay");
  if (overlay) overlay.addEventListener("click", () => {
    isExpanded = false;
    renderStageContent();
  });
}

async function generate(stageNumber, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';
  try {
    const data = await api("/generate-stage", {
      method: "POST",
      body: JSON.stringify({ project_id: projectId, stage_number: stageNumber }),
    });
    let stageData = stages.find((st) => st.number === stageNumber);
    if (!stageData) {
      stageData = { number: stageNumber, content: data.content, generated: true };
      stages.push(stageData);
    } else {
      stageData.content = data.content;
      stageData.generated = true;
    }
    if (project.current_stage < stageNumber + 1) {
      project.current_stage = Math.min(stageNumber + 1, STAGES.length);
    }
    isEditing = false;
    renderStageNav();
    renderStageContent();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function saveCurrentStage() {
  const btn = document.getElementById("saveBtn");
  const hint = document.getElementById("saveHint");
  const text = document.getElementById("stageText").value;
  btn.disabled = true;
  try {
    await api("/save-stage", {
      method: "POST",
      body: JSON.stringify({ project_id: projectId, stage_number: activeStageNumber, content: text }),
    });
    const stageData = stages.find((st) => st.number === activeStageNumber);
    if (stageData) stageData.content = text;
    hint.textContent = "Saved.";
    isEditing = false;
    renderStageContent();
  } catch (err) {
    hint.textContent = err.message;
    btn.disabled = false;
  }
}

function exportProposal() {
  const sectionsHtml = STAGES.map((s) => {
    const sd = stages.find((st) => st.number === s.number);
    const bodyHtml = sd && sd.content
      ? renderMarkdown(sd.content)
      : "<p><em>(Not yet generated)</em></p>";
    return `<h2>${s.number}. ${escapeHtml(s.title)}</h2>${bodyHtml}`;
  }).join("");

  const docHtml = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${escapeHtml(project.title)}</title>
    <style>
      body { font-family: Calibri, Arial, sans-serif; font-size: 12pt; line-height: 1.5; color: #111; }
      h1 { font-size: 18pt; margin-bottom: 4px; }
      h2 { font-size: 14pt; color: #0E4749; margin-top: 24px; }
      h3 { font-size: 12.5pt; color: #1C7373; }
      .ps { background: #F6ECD6; padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; }
    </style>
  </head><body>
    <h1>${escapeHtml(project.title)}</h1>
    <div class="ps"><strong>Problem Statement:</strong> ${escapeHtml(project.problem_statement)}</div>
    ${sectionsHtml}
  </body></html>`;

  const blob = new Blob(["\ufeff", docHtml], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (project.title || "research-proposal").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("exportBtn").addEventListener("click", exportProposal);

document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
  if (!confirm("Delete this project permanently? This cannot be undone.")) return;
  try {
    await api("/project?id=" + projectId, { method: "DELETE" });
    window.location.href = "/dashboard.html";
  } catch (err) {
    alert(err.message);
  }
});

load();
</script>
</body>
</html>
